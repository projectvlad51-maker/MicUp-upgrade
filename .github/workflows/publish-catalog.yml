name: Publish version catalog
on:
  push:
    tags: ['lite-v*']
    branches: ['main']
    paths:
      - 'docs/release-catalog.json'
      - 'docs/releases/**'
      - 'scripts/publish_releases.py'
      - '.github/workflows/publish-catalog.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: micup-version-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check transport against original uploaded source
        run: python3 scripts/check_original_audio_config.py
      - name: Check minimal 1.0.6 change scope
        run: python3 scripts/check_classic_scope.py
      - name: Validate and publish all described versions
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_releases.py --publish --make-public --stage-private
      - name: Record publication result
        if: always()
        env:
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, subprocess
          from pathlib import Path
          def git(*args, data=None):
              return subprocess.check_output(['git', *args], input=data).decode().strip()
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          visibility = subprocess.run(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY'],'--jq','.visibility'],capture_output=True,text=True)
          release_check = subprocess.run(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/releases?per_page=100'],capture_output=True,text=True)
          catalog_tags = {r['tag'] for r in json.loads(Path('docs/release-catalog.json').read_text())}
          confirmed = [{'tag':r['tag_name'],'draft':r['draft'],'assets':[a['name'] for a in r['assets']]} for r in json.loads(release_check.stdout) if r['tag_name'] in catalog_tags] if release_check.returncode == 0 else []
          report = {'source':git('rev-parse','HEAD'),'ref':os.environ['GITHUB_REF'],'result':os.environ['PUBLISH_RESULT'],
              'visibility': visibility.stdout.strip() if visibility.returncode == 0 else 'unknown',
              'time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'error':Path('publication-error.txt').read_text()[-4000:] if Path('publication-error.txt').exists() else None,
              'visibility_error':Path('publication-visibility-error.txt').read_text()[-2000:] if Path('publication-visibility-error.txt').exists() else None,
              'confirmed_releases':confirmed}
          probe = subprocess.run(['git','ls-remote','--exit-code','origin','refs/heads/publication-status'],capture_output=True,text=True)
          parent = []
          if probe.returncode == 0:
              subprocess.run(['git','fetch','origin','refs/heads/publication-status'],check=True)
              parent = ['-p',git('rev-parse','FETCH_HEAD')]
          elif probe.returncode != 2:
              raise RuntimeError('Cannot inspect publication status branch')
          blob = git('hash-object','-w','--stdin',data=(json.dumps(report,indent=2)+'\n').encode())
          tree = git('mktree',data=f'100644 blob {blob}\tlatest.json\n'.encode())
          commit = git('commit-tree',tree,*parent,'-m','Record version catalog publication')
          subprocess.run(['git','push','origin',commit+':refs/heads/publication-status'],check=True)
          print(json.dumps(report))
          PY
